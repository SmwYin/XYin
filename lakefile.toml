name = "XYin"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["XYin", "XYinTest"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "XYin"

# Tests and interactive examples (not part of the library).
[[lean_lib]]
name = "XYinTest"
